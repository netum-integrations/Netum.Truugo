name: ValidatorListProfiles_test_on_push
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Netum.Truugo.ValidatorListProfiles/**'
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/linux_build_test.yml@main
    with:
      workdir: Netum.Truugo.ValidatorListProfiles
      dotnet_version: 8.0.x
      strict_analyzers: true
      env_var_name_1: TRUUGO_API_USERNAME
      env_var_name_2: TRUUGO_API_PASSWORD
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      test_feed_api_key: ${{ secrets.TASKS_TEST_FEED_API_KEY }}
      env_var_value_1: ${{ secrets.TRUUGO_API_USERNAME }}
      env_var_value_2: ${{ secrets.TRUUGO_API_PASSWORD }}
