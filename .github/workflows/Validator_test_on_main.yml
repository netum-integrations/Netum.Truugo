name: Validator_test_on_main
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'Netum.Truugo.Validator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build
        working-directory: Netum.Truugo.Validator
      - name: Test
        run: dotnet test
        working-directory: Netum.Truugo.Validator
        env:
          TRUUGO_API_USERNAME: ${{ secrets.TRUUGO_API_USERNAME }}
          TRUUGO_API_PASSWORD: ${{ secrets.TRUUGO_API_PASSWORD }}
          TRUUGO_API_PROFILE_KEY: ${{ secrets.TRUUGO_API_PROFILE_KEY }}
          VALIDATOR_TEST_FILE_NAME: ${{ secrets.VALIDATOR_TEST_FILE_NAME }}
