name: Validator_test_on_push
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Netum.Truugo.Validator/**'
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/linux_build_test.yml@main
    with:
      workdir: Netum.Truugo.Validator
      dotnet_version: 8.0.x
      strict_analyzers: true
      env_var_name1: TRUUGO_API_USERNAME
      env_var_name2: TRUUGO_API_PASSWORD
      env_var_name3: TRUUGO_API_PROFILE_KEY
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      test_feed_api_key: ${{ secrets.TASKS_TEST_FEED_API_KEY }}
      env_var_value1: ${{ secrets.TRUUGO_API_USERNAME }}
      env_var_value2: ${{ secrets.TRUUGO_API_PASSWORD }}
      env_var_value3: ${{ secrets.TRUUGO_API_PROFILE_KEY }}